name: Bug Report
description: 재현 가능한 제품 결함을 보고합니다.
title: "[버그] "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        공개 저장소의 Issue입니다. 계정 정보, 토큰, 기관명, 담당자명, 참여자 개인정보, 민감한 화면 캡처를 올리지 마세요.
        필요한 데이터는 익명화된 fixture 또는 재현 단계로 대체합니다.
  - type: textarea
    id: summary
    attributes:
      label: Problem Description — 문제 설명
      description: 실제로 발생한 문제를 한두 문장으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce — 재현 단계
      description: 누구나 같은 결과를 얻을 수 있도록 번호로 적습니다.
      placeholder: |
        1. QA fixture의 owner 계정으로 로그인한다.
        2. 자료 확인 화면을 연다.
        3. 확인 처리를 저장한다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior — 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior — 실제 동작
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment — 실행 환경
      description: 브라우저·OS·브랜치 또는 commit SHA, 로컬/배포 환경, 관련 런타임 버전을 적습니다. 비밀값은 금지합니다.
      placeholder: macOS 15 / Chrome 최신 / local QA fixture / commit SHA
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria — 완료 조건
      description: 같은 재현 단계에서 기대 동작이 확인되는 조건과 회귀 방지 조건을 적습니다. 체크박스는 실제 검증 후에만 체크합니다.
      placeholder: |
        - [ ] 재현 단계에서 기대 동작을 확인한다.
        - [ ] 관련 정상·실패 또는 권한 범위의 회귀 검증을 통과한다.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 영향도
      options:
        - P1 - 핵심 흐름 중단 또는 데이터 손상 위험
        - P2 - 우회 가능하지만 운영에 영향
        - P3 - 경미한 오류 또는 시각적 문제
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그·스크린샷·추가 정보
      description: 민감정보를 제거한 최소 정보만 첨부합니다. 토큰·쿠키·개인정보는 절대 포함하지 마세요.
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 저장소 확인
      options:
        - label: 재현 정보에서 비밀값과 개인정보를 제거했습니다.
          required: true
