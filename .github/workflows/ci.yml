name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pure tests and next build import Supabase clients but do not connect to a database.
      # Keep placeholders here; real keys and local Supabase are intentionally not used in CI.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_JWT_SECRET: ci-jwt-secret
      APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pure tests import TypeScript sources directly (e.g.
          # scripts/attendance-dashboard-logic.test.mjs imports
          # ../src/services/attendance-dashboard-logic.ts), which requires Node's
          # built-in type stripping. Node 20 does not have it and fails with
          # ERR_UNKNOWN_FILE_EXTENSION.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
