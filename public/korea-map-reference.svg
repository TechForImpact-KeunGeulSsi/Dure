<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 560" role="img" aria-labelledby="title desc">
  <title id="title">대한민국 행정구역 지도</title>
  <desc id="desc">수도권, 강원도, 충청도, 전라도, 경상도, 제주도를 포함한 대한민국 도 단위 지도입니다.</desc>
  <defs>
    <linearGradient id="regionFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dce3ea"/>
      <stop offset="1" stop-color="#c3ccd5"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-14%" width="136%" height="132%">
      <feDropShadow dx="7" dy="11" stdDeviation="5" flood-color="#64748b" flood-opacity=".28"/>
    </filter>
    <style>
      .region {
        fill: url(#regionFill);
        stroke: #7f8b96;
        stroke-width: 3.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .city {
        fill: #cbd4dd;
        stroke: #7f8b96;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .label {
        fill: #164253;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        font-weight: 800;
      }
      .city-label {
        font-size: 14px;
      }
    </style>
  </defs>

